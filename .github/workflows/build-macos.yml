# Wrzuć ten plik do repozytorium jako: .github/workflows/build-macos.yml
# Po opublikowaniu wydania (Release) GitHub sam zbuduje wersję na macOS (Maca nie potrzebujesz)
# i dołączy LampaClient.dmg do tego wydania, obok Twojego .exe dla Windowsa.
name: Build macOS

on:
  release:
    types: [published]
  workflow_dispatch:            # ręcznie: Actions -> Build macOS -> Run workflow
    inputs:
      tag:
        description: "Tag wydania, do którego dołączyć plik (np. v4.0)"
        required: true

permissions:
  contents: write

env:
  MAIN_FILE: launcher.py                                  # nazwa głównego pliku launchera w repozytorium
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  macos:
    runs-on: macos-15-intel   # Intel: działa na Macach Intel i na Apple Silicon (przez Rosetta)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zależności
        run: pip install pyinstaller minecraft-launcher-lib pillow

      - name: Ikona aplikacji (lampa)
        continue-on-error: true      # jeśli się nie uda, aplikacja dostanie domyślną ikonę
        run: |
          python - << 'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location("lampa_main", os.environ["MAIN_FILE"])
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          m.make_app_icon(512).save("lampa.icns")
          PY

      - name: Zbuduj aplikację
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          ICON=""
          if [ -f lampa.icns ]; then ICON="--icon lampa.icns"; fi
          pyinstaller --noconfirm --windowed --name "Lampa Client" $ICON \
            --collect-all minecraft_launcher_lib "$MAIN_FILE"

      - name: Zrób plik .dmg
        run: |
          mkdir dmg
          cp -R "dist/Lampa Client.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Lampa Client" -srcfolder dmg -ov -format UDZO LampaClient.dmg

      - name: Dołącz do wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" LampaClient.dmg --clobber
